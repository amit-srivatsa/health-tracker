<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Only this site's own files may run. The app talks only to Google's Drive and sign-in APIs, and to Claude when you turn on photo reading. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://www.googleapis.com https://oauth2.googleapis.com https://api.anthropic.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>Health Tracker</title>
<meta name="description" content="A private calorie, water, workout, sleep and weight tracker. Your data stays on your phone and in your own Google Drive.">
<meta name="theme-color" content="#F5F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111312" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Health">
<link rel="stylesheet" href="src/styles.css">
<script type="module" src="src/app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <button class="avatar" id="avatar" data-act="settings" aria-label="Settings"></button>
    <div class="hello"><b id="hello">Hello!</b><span id="hdate"></span></div>
    <button class="syncpill" id="syncpill" data-act="syncnow" hidden></button>
    <button class="round" data-act="today" aria-label="Jump to today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></button>
  </header>
  <main id="main" class="stack"></main>
</div>
<div class="tabs"><nav aria-label="Sections">
  <button class="tab" data-tab="today" aria-label="Today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c1-3.6 3.8-5.5 7-5.5s6 1.9 7 5.5"/></svg><span class="lb">Today</span></button>
  <button class="tab" data-tab="trends" aria-label="Trends"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-4 3 3 6-7"/></svg><span class="lb">Trends</span></button>
  <button class="tab" data-tab="foods" aria-label="Foods"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 7c0-1.5 1-2 1-3.5M13 7c0-1.5 1-2 1-3.5"/></svg><span class="lb">Foods</span></button>
</nav></div>
<div id="sheet" hidden></div>
<div id="viewer" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<input type="file" id="photoInput" class="filebtn" accept="image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="avatarInput" class="filebtn" accept="image/*" tabindex="-1" aria-hidden="true">
<input type="file" id="importInput" class="filebtn" accept="application/json,.json" tabindex="-1" aria-hidden="true">
<noscript><p style="padding:16px">Health Tracker needs JavaScript.</p></noscript>
</body>
</html>
